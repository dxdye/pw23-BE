services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8000
      CACHE_DB_PATH: /app/data/cache.db
    ports:
      - "8000:8000"
    volumes:
      - cache-data:/app/data
    # Der Cache ist ein paar hundert KB SQLite. Ohne Datenbankserver bleibt auf
    # einem 1-GB-Host genug Luft für nginx und einen zweiten Dienst.
    mem_limit: 256m

  test:
    build: .
    working_dir: /app
    user: root
    command:
      [
        "deno",
        "test",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
      ]
    volumes:
      - .:/app
    profiles: ["tools"]

volumes:
  cache-data:
